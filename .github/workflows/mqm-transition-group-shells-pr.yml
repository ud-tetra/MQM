name: MQM transition group and shells replay

on:
  pull_request:
    paths:
      - 'research/architecture/2026-10-09T1510Z_mqm_transition_group_and_shells_v01.cpp'
      - 'review_handoff/MQM_TRANSITION_GROUP_SHELLS_v0.1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -O3 -std=c++17 research/architecture/2026-10-09T1510Z_mqm_transition_group_and_shells_v01.cpp -o mgroup
      - name: Run
        run: |
          ./mgroup > MQM_TRANSITION_GROUP_SHELLS_RESULTS_v0.1.json
          cat MQM_TRANSITION_GROUP_SHELLS_RESULTS_v0.1.json
      - name: Hash
        run: |
          sha256sum research/architecture/2026-10-09T1510Z_mqm_transition_group_and_shells_v01.cpp MQM_TRANSITION_GROUP_SHELLS_RESULTS_v0.1.json > MQM_TRANSITION_GROUP_SHELLS_SHA256_v0.1.txt
          cat MQM_TRANSITION_GROUP_SHELLS_SHA256_v0.1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MQM-transition-group-shells-v0.1
          path: |
            MQM_TRANSITION_GROUP_SHELLS_RESULTS_v0.1.json
            MQM_TRANSITION_GROUP_SHELLS_SHA256_v0.1.txt
