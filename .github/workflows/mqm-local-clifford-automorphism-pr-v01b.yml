name: MQM local Clifford automorphism replay v0.1b

on:
  pull_request:
    paths:
      - 'research/architecture/2026-10-09T1445Z_mqm_local_clifford_automorphism_v01b.cpp'
      - 'review_handoff/MQM_LOCAL_CLIFFORD_AUT_v0.1b/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -O3 -std=c++17 research/architecture/2026-10-09T1445Z_mqm_local_clifford_automorphism_v01b.cpp -o lcaut
      - name: Run
        run: |
          ./lcaut > MQM_LOCAL_CLIFFORD_AUT_RESULTS_v0.1b.json
          cat MQM_LOCAL_CLIFFORD_AUT_RESULTS_v0.1b.json
      - name: Hash
        run: |
          sha256sum research/architecture/2026-10-09T1445Z_mqm_local_clifford_automorphism_v01b.cpp MQM_LOCAL_CLIFFORD_AUT_RESULTS_v0.1b.json > MQM_LOCAL_CLIFFORD_AUT_SHA256_v0.1b.txt
          cat MQM_LOCAL_CLIFFORD_AUT_SHA256_v0.1b.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MQM-local-Clifford-aut-v0.1b
          path: |
            MQM_LOCAL_CLIFFORD_AUT_RESULTS_v0.1b.json
            MQM_LOCAL_CLIFFORD_AUT_SHA256_v0.1b.txt
