name: MQM shape motion semantics replay

on:
  pull_request:
    paths:
      - 'research/architecture/2026-10-09T1645Z_mqm_shape_motion_semantics_v01.cpp'
      - 'review_handoff/MQM_SHAPE_MOTION_v0.1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -O3 -std=c++17 research/architecture/2026-10-09T1645Z_mqm_shape_motion_semantics_v01.cpp -o sm
      - name: Run
        run: |
          ./sm > MQM_SHAPE_MOTION_RESULTS_v0.1.json
          cat MQM_SHAPE_MOTION_RESULTS_v0.1.json
      - name: Hash
        run: |
          sha256sum research/architecture/2026-10-09T1645Z_mqm_shape_motion_semantics_v01.cpp MQM_SHAPE_MOTION_RESULTS_v0.1.json > MQM_SHAPE_MOTION_SHA256_v0.1.txt
          cat MQM_SHAPE_MOTION_SHA256_v0.1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MQM-shape-motion-v0.1
          path: |
            MQM_SHAPE_MOTION_RESULTS_v0.1.json
            MQM_SHAPE_MOTION_SHA256_v0.1.txt
