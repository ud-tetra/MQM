name: MQM identity motion dynamics replay

on:
  pull_request:
    paths:
      - 'research/architecture/2026-10-09T1820Z_mqm_identity_motion_dynamics_v01.cpp'
      - 'review_handoff/MQM_IDENTITY_MOTION_DYNAMICS_v0.1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -O3 -std=c++17 research/architecture/2026-10-09T1820Z_mqm_identity_motion_dynamics_v01.cpp -o dyn
      - name: Run
        run: |
          ./dyn > MQM_IDENTITY_MOTION_DYNAMICS_RESULTS_v0.1.json
          cat MQM_IDENTITY_MOTION_DYNAMICS_RESULTS_v0.1.json
      - name: Hash
        run: |
          sha256sum research/architecture/2026-10-09T1820Z_mqm_identity_motion_dynamics_v01.cpp MQM_IDENTITY_MOTION_DYNAMICS_RESULTS_v0.1.json > MQM_IDENTITY_MOTION_DYNAMICS_SHA256_v0.1.txt
          cat MQM_IDENTITY_MOTION_DYNAMICS_SHA256_v0.1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MQM-identity-motion-dynamics-v0.1
          path: |
            MQM_IDENTITY_MOTION_DYNAMICS_RESULTS_v0.1.json
            MQM_IDENTITY_MOTION_DYNAMICS_SHA256_v0.1.txt
