name: MQM artifact and offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_research_site.py
      - run: python scripts/build_offline_site.py
      - run: python scripts/verify_session_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: MQM-offline-website
          path: offline-build/MQM_OFFLINE_WEBSITE_v1.zip
