name: MQM Dm tetrahedral realization replay

on:
  pull_request:
    paths:
      - 'research/architecture/2026-10-09T1435Z_mqm_dm_tetrahedral_realization_v01.py'
      - 'review_handoff/MQM_DM_TETRA_v0.1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: |
          python3 research/architecture/2026-10-09T1435Z_mqm_dm_tetrahedral_realization_v01.py > MQM_DM_TETRA_RESULTS_v0.1.json
          cat MQM_DM_TETRA_RESULTS_v0.1.json
      - name: Hash
        run: |
          sha256sum research/architecture/2026-10-09T1435Z_mqm_dm_tetrahedral_realization_v01.py MQM_DM_TETRA_RESULTS_v0.1.json > MQM_DM_TETRA_SHA256_v0.1.txt
          cat MQM_DM_TETRA_SHA256_v0.1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MQM-Dm-tetra-v0.1
          path: |
            MQM_DM_TETRA_RESULTS_v0.1.json
            MQM_DM_TETRA_SHA256_v0.1.txt
