name: MQM Dm coupler fiber replay

on:
  pull_request:
    paths:
      - 'research/architecture/2026-10-09T2010Z_mqm_Dm_coupler_fiber_v01.py'
      - 'review_handoff/MQM_DM_COUPLER_FIBER_v0.1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: |
          python3 research/architecture/2026-10-09T2010Z_mqm_Dm_coupler_fiber_v01.py > MQM_DM_COUPLER_FIBER_RESULTS_v0.1.json
          cat MQM_DM_COUPLER_FIBER_RESULTS_v0.1.json
      - name: Hash
        run: |
          sha256sum research/architecture/2026-10-09T2010Z_mqm_Dm_coupler_fiber_v01.py MQM_DM_COUPLER_FIBER_RESULTS_v0.1.json > MQM_DM_COUPLER_FIBER_SHA256_v0.1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MQM-Dm-coupler-fiber-v0.1
          path: |
            MQM_DM_COUPLER_FIBER_RESULTS_v0.1.json
            MQM_DM_COUPLER_FIBER_SHA256_v0.1.txt
