name: MQM v128 native compile replay

on:
  pull_request:
    paths:
      - 'research/hardware/2026-10-09T2040Z_mqm_v128_native_compile_v01.cpp'
      - 'review_handoff/MQM_V128_NATIVE_v0.1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -O3 -std=c++17 research/hardware/2026-10-09T2040Z_mqm_v128_native_compile_v01.cpp -o v128
      - name: Run
        run: |
          ./v128 > MQM_V128_NATIVE_COMPILE_RESULTS_v0.1.json
          cat MQM_V128_NATIVE_COMPILE_RESULTS_v0.1.json
      - name: Hash
        run: |
          sha256sum research/hardware/2026-10-09T2040Z_mqm_v128_native_compile_v01.cpp MQM_V128_NATIVE_COMPILE_RESULTS_v0.1.json > MQM_V128_NATIVE_SHA256_v0.1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MQM-v128-native-v0.1
          path: |
            MQM_V128_NATIVE_COMPILE_RESULTS_v0.1.json
            MQM_V128_NATIVE_SHA256_v0.1.txt
